name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install tkcalendar pandas

      - name: Syntax check
        run: |
          python -m compileall -q cashflow_app.py src/ dashboard.py import_wizard.py

      - name: Import-time smoke test
        env:
          DISPLAY: ":99"
        run: |
          # Start virtual display so Tk doesn't fail on import
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          python -c "import src.parsers; import src.database; import src.categorization; print('imports OK')"

      - name: Parser sanity check
        run: |
          python -c "from src.parsers import ALL_PARSERS, detect_parser; print(f'{len(ALL_PARSERS)} parsers loaded')"
